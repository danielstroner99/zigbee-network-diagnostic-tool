<script>
    // Pripojíme sa na Python backend
    var socket = io();

    // Počúvame na kanáli 'nova_sprava' (názov musí sedieť s tým v app.py)
    socket.on('nova_sprava', function(data) {
        // Nájdeme náš element podľa ID
        var textovyElement = document.getElementById('mqtt-text');
        
        // Prepíšeme jeho obsah novou správou
        // data.payload je to, čo posiela Python
        textovyElement.innerHTML = "Aktuálny stav: " + data.payload;
        
        // Voliteľné: Ak chceš, aby to po príchode správy bliklo alebo zmenilo farbu
        textovyElement.style.color = "#00ff00"; 
    });
</script>
