    <title>Smart UIAM Map</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
	<style>
		body {
			margin: 5px;
			padding: 5px;
			background-color: #222;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		.map-wrapper {
			width: 100%;
			height: 95%;
			overflow: auto; /* Activates moving when too small*/
			border: 1px solid #ccc;
			background: #f4f4f4;
		}
		.top-bar {
			color: white;
			background-color: #004a99;
			display: flex;
			justify-content: space-between;
			align-items: center;
			position: sticky;
			top: 0;
			left: 0;
			z-index: 1000;
			height: 80px;      /* Fixed height */
			box-sizing: border-box;
			overflow: hidden;   /* Nothing goes out */
		}
		.top-bar p, .top-bar h1 {
    		margin: 0;
 		    padding: 5px;
  			flex-shrink: 1;    /* Allows elements to shrink */
   			min-width: 0;      /* Necessary for proper shrinking */
		}
		.top-bar h1 {
   			font-size: 24px;   /* Basic heading fontsize */
  			padding: 0 10px;
		}
		.top-bar p {
    		font-size: 14px;   /* Basic text fontsize */
		}
		.bottom-bar {  /* SCRAPPED, BOTTOM BAR IS EMPTY due to moving problems */
			padding: 5px;
			display: flex;
			position: sticky;
			bottom: 0;
			left: 0;
			z-index: 1000;
		}
		#map-svg {
			display: block;
			width: 100%;
			height: auto;
			max-width: none;
			/* Readability limit: map should not get smaller under 1080px */
			min-width: 1080px; 
			min-height: 500px; 
			transition: transform 0.2s ease; /* Zoom preparation */
			transform-origin: 0 0; /* Left top corner zoom */
		}
		#info-panel {
			padding: 5px;
			display: flex;
			gap: 10px;
			position: sticky;
			top: 80px; /* Rigth under the top bar */
			left: 0;
			z-index: 1001;
			background: rgba(244, 244, 244, 0.9); /* Partly-visible background*/
		}

/* --- RESPONSIVE FONTSIZE --- */

		/* If window < 1200px */
		@media (max-width: 1200px) {
			.top-bar h1 { font-size: 18px; }
			.top-bar p { font-size: 12px; }
		}

		/* If window < 900px */
		@media (max-width: 900px) {
			.top-bar h1 { font-size: 15px; }
			.top-bar p { font-size: 10px; }
		}

</style>
</head>

	<script> 
	    // Javascript code starts here
		var socket = io();         // Starts Socket.IO connection
		var activeMarkers = {};    // We remember all positions to avoid collisions
		let scale = 1; 			   // Zoom variable
		// Get references to SVG and wrapper
		const svgMap = document.getElementById('map-svg');
		const wrapper = document.querySelector('.map-wrapper');

		// Functions

		// Function to get COLOR based on LQI value - spectrum from black (0) to red(30) to green(150) to blue(255)
		function getLQIColor(lqi) {
			lqi = Math.min(255, Math.max(0, lqi));
			if (lqi <= 30) return "#000000";
			let hue = lqi <= 150 ? ((lqi - 31) / 119) * 120 : 120 + (((lqi - 150) / 105) * 100);
			return `hsl(${hue}, 90%, 50%)`;
		}

		// Function to get or create the markers layer - it has to be always on top
		function getMarkersLayer() {
			let layer = document.getElementById('markers-layer');
			if (!layer) {
				layer = document.createElementNS("http://www.w3.org/2000/svg", "g");
				layer.setAttribute('id', 'markers-layer');
				svgMap.appendChild(layer); // Pridá na úplný koniec SVG = najvyššia vrstva
			}
			return layer;
		}

		// Function to update time display
		function updateTime(cas) {
			const casSpan = document.getElementById('val-cas');
			if (!casSpan) return;
			if (cas) {
				casSpan.textContent = cas;
			} else {
				const teraz = new Date();
				casSpan.textContent = teraz.getHours().toString().padStart(2, '0') + ":" + 
									teraz.getMinutes().toString().padStart(2, '0') + ":" + 
									teraz.getSeconds().toString().padStart(2, '0');
			}
		}

		// Zoom logic - only map has to zoom, not the top bar and info panel
		wrapper.addEventListener('wheel', function(e) { // Follow mouse wheel
			if (e.ctrlKey) {                            // Logic only if CTRL is pressed
				e.preventDefault(); 
				const zoomSpeed = 0.1;
				if (e.deltaY < 0) scale += zoomSpeed;
				else scale = Math.max(0.5, scale - zoomSpeed);
				
				svgMap.style.transform = `scale(${scale})`;
				svgMap.style.width = scale > 1 ? (100 * scale) + "%" : "100%";
			}
		}, { passive: false });

		// Data processing function and marker drawing
		function spracujData(data) {
			updateTime(data.cas);                                  // Update time display

			const roomId = "r1-6-" + data.miestnost;               // Room ID in SVG
			const roomElement = document.getElementById(roomId);   // Find room element
			if (!roomElement) return;                              // If room not found, skip

			// We need to place marker inside the room, avoiding collisions
			const markersLayer = getMarkersLayer(); 				      // Get or create markers layer
			const xBase = parseFloat(roomElement.getAttribute('x'));      // Room position and size
			const yBase = parseFloat(roomElement.getAttribute('y'));      // in SVG
			const roomW = parseFloat(roomElement.getAttribute('width'));  // to limit marker placement
			const roomH = parseFloat(roomElement.getAttribute('height')); // inside the room
			
			const deviceIdSafe = data.zariadenie.replace(/\s+/g, '-');           // Safe ID for HTML elements
			const oldMarker = document.getElementById('marker-' + deviceIdSafe); // Check for existing marker
			if (oldMarker) oldMarker.remove(); 					             	 // Remove old marker if exists

			// Text length measurement
			const tempText = document.createElementNS("http://www.w3.org/2000/svg", "text"); // Temporary text element
			tempText.setAttribute('font-size', '3.8');
			tempText.style.fontWeight = "bold";
			tempText.style.fontFamily = "Arial, sans-serif"; 
			tempText.textContent = `${data.zariadenie} (${data.kvalita})`;
			markersLayer.appendChild(tempText); // Add to SVG to measure
			
			const bW = tempText.getComputedTextLength() + 12; // Box width based on text length
			const bH = 6.5; 							      // Box height fixed
			markersLayer.removeChild(tempText);               // Remove temporary text

			// Collision avoidance - find a spot inside the room
			let finalX = xBase, finalY = yBase, foundSpot = false; // Default position

			for (let y = yBase; y < yBase + roomH + 15 && !foundSpot; y += 0.5) { // Scan rows
				for (let x = xBase; x < xBase + roomW && !foundSpot; x += 1.5) {  // Scan columns
					let collision = false;										  // Check for collisions with existing markers
					for (let id in activeMarkers) {                               // For each active marker
						if (id === deviceIdSafe) continue;                        // Skip self
						let other = activeMarkers[id];                            // Get other marker position
						// Simple AABB collision detection with small margin
						if (!(x + bW < other.x - 0.2 || x > other.x + other.w + 0.2 || // X axis
							y + bH < other.y - 0.2 || y > other.y + other.h + 0.2)) {  // Y axis
							collision = true;
							break;
						}
					}
					// If no collision, we found a spot
					if (!collision) {
						finalX = x; finalY = y;
						foundSpot = true;
					}
				}
			}
			
			// Remember marker position
			activeMarkers[deviceIdSafe] = { x: finalX, y: finalY, w: bW, h: bH };
			
			// Create marker elements
			const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
			g.setAttribute('id', 'marker-' + deviceIdSafe);
			g.style.pointerEvents = "none";
			
			// Background rectangle
			const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
			rect.setAttribute('x', finalX); rect.setAttribute('y', finalY);
			rect.setAttribute('width', bW); rect.setAttribute('height', bH);
			rect.setAttribute('fill', 'white'); rect.setAttribute('stroke', '#999');
			rect.setAttribute('stroke-width', '0.1'); rect.setAttribute('rx', '0.5');
			
			// Circle indicator with color based on LQI
			const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
			circle.setAttribute('cx', finalX + 3); circle.setAttribute('cy', finalY + 3.25);
			circle.setAttribute('r', '1.4'); circle.setAttribute('fill', getLQIColor(data.kvalita));
			
			// Text element
			const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
			text.setAttribute('x', finalX + 6.5); text.setAttribute('y', finalY + 4.6);
			text.setAttribute('font-size', '3.8');
			text.style.fontWeight = "bold"; 
			text.style.fontFamily = "Arial, sans-serif";
			text.textContent = `${data.zariadenie} (${data.kvalita})`;

			// Assemble marker
			g.appendChild(rect); g.appendChild(circle); g.appendChild(text);
			markersLayer.appendChild(g); 
		}


		// Buttons logic:

		// Refresh button
		document.getElementById('btn-refresh').addEventListener('click', function() {
			activeMarkers = {}; 
			const layer = document.getElementById('markers-layer');
			if (layer) layer.innerHTML = '';
			socket.emit('get_history'); 
		});

		// Send request to all devices button
		document.getElementById('btn-request-all').addEventListener('click', async function () {
			console.log("Odosielanie hromadnej požiadavky...");

			// Small visual feedback

		try {
		const res = await fetch("/api/topology/refresh", { method: "POST" });
		const data = await res.json();
		console.log("Topology response:", data);
		} catch (e) {
			console.error("Refresh failed:", e);
		}

			this.textContent = "📡 Send Request to All Available Devices";
		});


		// Socket.IO event handlers

		// On receiving history data
		socket.on('history_data', function(history) {
			activeMarkers = {}; 
			const layer = document.getElementById('markers-layer');
			if (layer) layer.innerHTML = '';
			
			const sorted = Object.keys(history).sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
			sorted.forEach(device => {
				const records = history[device];
				if (records && records.length > 0) {
					const last = records[records.length - 1];
					spracujData({
						zariadenie: device, 
						miestnost: last.miestnost, 
						kvalita: last.lqi, 
						cas: last.cas
					});
				}
			});
		});
		// On receiving new message
		socket.on('nova_sprava', (d) => spracujData(d));
		// On connection, request history
		socket.on('connect', () => {
			socket.emit('get_history');
		});
	</script>
</body>
